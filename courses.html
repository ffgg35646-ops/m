<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>الكورسات | منصة علي عليان الدولية</title>
  <style>
    :root{color-scheme:light;--bg:#fff;--text:#1f2937;--muted:#6b7280;--card:#fff;--border:#e5e7eb;--orange:#f5a623;--p:#2aa9e0;--p2:#0f7a9a;box-sizing:border-box}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#111827;--text:#f3f4f6;--muted:#9ca3af;--card:#1f2937;--border:#374151}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif}
    a{color:inherit}
    /* Shared site navigation: kept separate from the courses page content. */
    .site-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg);gap:16px;flex-wrap:wrap}
    .site-nav nav{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
    .site-nav nav a{color:var(--text);text-decoration:none;padding:8px 12px;border-radius:8px;font-size:16px;white-space:nowrap}
    .site-nav nav a[aria-current="page"]{color:var(--p);background:rgba(42,169,224,.12);border-bottom:2px solid var(--p)}
    .nav-tools{display:flex;align-items:center;gap:10px;direction:ltr}
    .tool{min-width:44px;height:42px;padding:0 10px;border:1px solid var(--p);border-radius:10px;display:grid;place-items:center;color:var(--p);font-size:13px;font-weight:700;background:transparent}
    .profile{display:flex;align-items:center;gap:9px;direction:ltr;color:var(--text);white-space:nowrap}
    .avatar{width:42px;height:42px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:17px}
    .hero{background:linear-gradient(135deg,#2db6f2,#0f7a9a);color:#fff;text-align:center;padding:100px 20px;position:relative;overflow:hidden}
    .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
    .hero:before{width:220px;height:220px;left:10%;bottom:-100px}
    .hero:after{width:165px;height:165px;right:18%;top:35px}
    .hero small{display:flex;align-items:center;justify-content:center;gap:14px;font-size:16px;letter-spacing:2px;opacity:.9;position:relative}
    .hero small:before,.hero small:after{content:"";width:55px;height:1px;background:#fff;opacity:.7}
    .hero h1{font-size:44px;margin:14px 0 10px;position:relative}
    .hero p{margin:0;font-size:18px;opacity:.9;position:relative}
    .wrap{max-width:1290px;margin:0 auto;padding:0 20px}
    .filter{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:25px 26px 27px;margin-top:-48px;position:relative;z-index:2}
    .filter h2{margin:0 0 22px;font-size:21px;display:flex;align-items:center;gap:9px}
    .filter h2 span{color:#6366f1}
    .filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .field label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:8px}
    .field label span{color:#6366f1}
    select{width:100%;height:46px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);padding:0 14px;font-size:15px;font-family:inherit}
    .courses-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 34px;margin:30px 0 40px}
    .course-card{background:var(--orange);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.08);min-width:0}
    .course-cover{height:270px;background:#fff;display:grid;place-items:center;text-align:center;color:#1e2a5a;font-weight:800;padding:14px}
    .course-cover strong{display:block;font-size:29px;color:#1e2a5a}
    .course-cover span{display:block;font-size:17px;margin-top:7px}
    .course-content{padding:16px 14px 18px;color:#fff;display:flex;flex:1;flex-direction:column}
    .course-content h3{margin:0 0 12px;font-size:18px;text-align:right;font-weight:600;line-height:1.5}
    .tags{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
    .tag{background:rgba(255,255,255,.22);border-radius:20px;padding:5px 11px;font-size:12px}
    .course-actions{display:flex;gap:10px;margin-top:auto}
    .course-actions a{flex:1;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;border-radius:8px;padding:11px 7px;text-align:center;font-size:14px}
    .course-actions a:first-child{flex:1.2}
    .pagination{display:flex;justify-content:center;gap:10px;margin:0 0 65px;direction:ltr}
    .pagination button{width:44px;height:44px;border:1px solid var(--p);border-radius:8px;color:var(--p);background:var(--card);font:inherit;cursor:pointer}
    .pagination button[aria-current="page"]{background:var(--p);color:#fff}
    .chat-button{position:fixed;right:30px;bottom:30px;width:58px;height:58px;border:0;border-radius:50%;background:#0a84ff;display:grid;place-items:center;color:#fff;font-size:25px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
    .empty{grid-column:1/-1;text-align:center;padding:35px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:12px}
    @media(max-width:900px){.courses-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.site-nav nav{gap:6px}.site-nav nav a{font-size:14px;padding:7px 9px}}
    @media(max-width:620px){.site-nav{padding:12px 14px}.site-nav nav{display:none}.nav-tools{margin-inline-start:auto}.profile span{font-size:13px}.hero{padding:78px 16px}.hero h1{font-size:31px}.hero p{font-size:15px;line-height:1.8}.wrap{padding:0 14px}.filter{padding:20px 16px;margin-top:-35px}.filter-grid,.courses-grid{grid-template-columns:1fr}.course-cover{height:235px}.chat-button{right:18px;bottom:18px;width:54px;height:54px}}
  </style>
</head>
<body>
  <header class="site-nav" aria-label="التنقل الرئيسي">
    <nav aria-label="القائمة الرئيسية">
      <a href="index.html">الرئيسية</a>
      <a href="courses.html" aria-current="page">الكورسات</a>
      <a href="#">الجلسات المباشرة</a>
      <a href="#">المكتبة</a>
      <a href="#">المدونة</a>
      <a href="support.html">الدعم والتواصل</a>
    </nav>
    <div class="nav-tools">
      <button class="tool" type="button" aria-label="العملة">EGP</button>
      <button class="tool" type="button" aria-label="اللغة">🌐</button>
      <button class="tool" type="button" aria-label="الإشعارات">♧</button>
      <div class="profile"><div class="avatar" aria-hidden="true">م</div><span>مرحبا mohajmed</span></div>
    </div>
  </header>

  <main id="courses">
    <section class="hero">
      <small>الكورسات</small>
      <h1>استكشف دوراتنا التعليمية</h1>
      <p>مجموعة متنوعة من الدورات المصممة لتناسب احتياجاتك التعليمية</p>
    </section>

    <div class="wrap">
      <section class="filter" aria-labelledby="filter-title">
        <h2 id="filter-title"><span aria-hidden="true">▼</span> تصفية الكورسات</h2>
        <div class="filter-grid">
          <div class="field"><label for="category"><span>▤</span> فئة السنة الدراسية</label><select id="category"><option value="">الكل</option><option>LEVEL 1</option><option>البكالوريا</option></select></div>
          <div class="field"><label for="grade"><span>🎓</span> السنة الدراسية</label><select id="grade"><option value="">الكل</option><option>G 10 , G 11</option><option>Grade 9</option><option>Grade 5</option><option>Grade 4</option></select></div>
          <div class="field"><label for="subject"><span>🔖</span> المادة</label><select id="subject"><option value="">الكل</option><option>اللغة العربية</option><option>النحو</option></select></div>
          <div class="field"><label for="division"><span>☰</span> الشعبة</label><select id="division"><option value="">الكل</option><option>المصرية</option></select></div>
        </div>
      </section>

      <section class="courses-grid" id="courses-grid" aria-label="قائمة الكورسات"></section>
      <nav class="pagination" id="pagination" aria-label="صفحات الكورسات">
        <button type="button" data-page="prev" aria-label="السابق">‹</button>
        <button type="button" data-page="1" aria-current="page">1</button>
        <button type="button" data-page="2">2</button>
        <button type="button" data-page="next" aria-label="التالي">›</button>
      </nav>
    </div>
  </main>

  <button class="chat-button" type="button" aria-label="المحادثة">💬</button>

  <script>
    const courses = [
      {title:"LEVEL 1 - G 10 , G 11",grade:"Level 1 - G 10 , G 11",subject:"اللغة العربية",price:"800.00",category:"LEVEL 1",cover:"اللغة العربية - G 10 , G 11",division:""},
      {title:"( اللغة العربية ( الأول الثانوي",grade:"( البكالوريا ( الأول الثانوي",subject:"البكالوريا - اللغة العربية",price:"500.00",category:"البكالوريا",cover:"المصرية",division:"المصرية"},
      {title:"كورس النحـــو - G 9",grade:"Grade 9",subject:"النحو",price:"800.00",category:"Grade 9",cover:"كورس النحو",division:""},
      {title:"كورس النحـــو - G 4",grade:"Grade 4",subject:"النحو",price:"500.00",category:"Grade 4",cover:"كورس النحو",division:""},
      {title:"كورس النحـــو - G 5",grade:"Grade 5",subject:"النحو",price:"500.00",category:"Grade 5",cover:"كورس النحو",division:""}
    ];
    const grid = document.getElementById("courses-grid");
    const filters = ["category","grade","subject","division"].map(id=>document.getElementById(id));
    let page = 1;
    const perPage = 6;

    function render(){
      const [category,grade,subject,division] = filters.map(el=>el.value);
      const filtered = courses.filter(course =>
        (!category || course.category===category) &&
        (!grade || course.grade===grade) &&
        (!subject || course.subject===subject) &&
        (!division || course.division===division)
      );
      const pages = Math.max(1,Math.ceil(filtered.length/perPage));
      page = Math.min(page,pages);
      grid.replaceChildren();
      const shown = filtered.slice((page-1)*perPage,page*perPage);
      if(!shown.length){
        const empty=document.createElement("p");
        empty.className="empty";
        empty.textContent="لا توجد كورسات مطابقة لخيارات التصفية.";
        grid.append(empty);
      }
      shown.forEach(course=>{
        const card=document.createElement("article"); card.className="course-card";
        const cover=document.createElement("div"); cover.className="course-cover";
        const coverText=document.createElement("div");
        const level=document.createElement("strong"); level.textContent=course.category;
        const name=document.createElement("span"); name.textContent=course.cover;
        const instructor=document.createElement("span"); instructor.textContent="علي محمد عليان";
        coverText.append(level,name,instructor); cover.append(coverText);
        const content=document.createElement("div"); content.className="course-content";
        const title=document.createElement("h3"); title.textContent=course.title;
        const tags=document.createElement("div"); tags.className="tags";
        [course.subject,course.grade].forEach((value,index)=>{
          const tag=document.createElement("span"); tag.className="tag"; tag.textContent=(index===0?"🔖 ":"🎓 ")+value; tags.append(tag);
        });
        const actions=document.createElement("div"); actions.className="course-actions";
        const enroll=document.createElement("a"); enroll.href="#"; enroll.textContent="EGP "+course.price+" • اشترك الآن";
        const details=document.createElement("a"); details.href="#"; details.textContent="تفاصيل الكورس ⓘ";
        actions.append(enroll,details); content.append(title,tags,actions); card.append(cover,content); grid.append(card);
      });
      document.querySelectorAll("#pagination button[data-page]").forEach(button=>{
        const value=button.dataset.page;
        const target=value==="prev"?Math.max(1,page-1):value==="next"?Math.min(pages,page+1):Number(value);
        button.disabled=(value==="prev"&&page===1)||(value==="next"&&page===pages)||(value!=="prev"&&value!=="next"&&target>pages);
        if(value!=="prev"&&value!=="next"){
          if(target===page) button.setAttribute("aria-current","page"); else button.removeAttribute("aria-current");
          button.hidden=target>pages;
        }
      });
    }
    filters.forEach(filter=>filter.addEventListener("change",()=>{page=1;render()}));
    document.getElementById("pagination").addEventListener("click",event=>{
      const button=event.target.closest("button[data-page]"); if(!button||button.disabled)return;
      const value=button.dataset.page;
      page=value==="prev"?page-1:value==="next"?page+1:Number(value);
      render();
    });
    render();
  </script>
</body>
</html>
